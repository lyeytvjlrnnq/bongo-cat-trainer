<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background sticker base -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#1a1030"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#f5e6d3" stroke-width="6"/>
  
  <!-- Drum pad, slightly off-center and tilted -->
  <g transform="translate(4, 6)">
    <polygon points="56,166 206,152 216,214 66,228" fill="#ff4d6d" stroke="#f5e6d3" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="70,178 196,166 202,206 76,218" fill="#1a1030" opacity="0.25"/>
    <!-- Pad rim highlight -->
    <polyline points="62,172 196,160 204,200" fill="none" stroke="#f5e6d3" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Motion arcs (three) above pad -->
  <g stroke="#4de1ff" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 64 148 Q 82 108 118 92"/>
    <path d="M 92 154 Q 108 118 142 104"/>
    <path d="M 122 160 Q 136 128 166 116"/>
  </g>

  <!-- Cat paw, chunky rounded, striking down-right -->
  <g transform="translate(0,0)">
    <!-- Paw main pad -->
    <path d="M 128 56
             C 152 52, 176 64, 184 88
             C 192 110, 184 134, 168 148
             C 156 158, 140 160, 126 154
             C 118 150, 110 142, 108 130
             C 104 114, 108 96, 114 82
             C 118 70, 122 60, 128 56 Z"
          fill="#f5e6d3" stroke="#1a1030" stroke-width="6" stroke-linejoin="round"/>
    <!-- Toe beans -->
    <ellipse cx="140" cy="76" rx="11" ry="9" fill="#ff4d6d" stroke="#1a1030" stroke-width="4"/>
    <ellipse cx="164" cy="82" rx="10" ry="8" fill="#ff4d6d" stroke="#1a1030" stroke-width="4"/>
    <ellipse cx="176" cy="106" rx="9" ry="8" fill="#ff4d6d" stroke="#1a1030" stroke-width="4"/>
    <ellipse cx="168" cy="130" rx="8" ry="7" fill="#ff4d6d" stroke="#1a1030" stroke-width="4"/>
    <!-- Big center pad -->
    <ellipse cx="138" cy="116" rx="20" ry="16" fill="#ff4d6d" stroke="#1a1030" stroke-width="5"/>
    <!-- Paw wrist/leg going up-left off frame -->
    <path d="M 118 70
             C 108 46, 100 28, 92 10
             L 116 4
             C 122 26, 126 50, 128 62 Z"
          fill="#f5e6d3" stroke="#1a1030" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Pixel spark (tiny) near impact -->
  <g>
    <rect x="188" y="146" width="6" height="6" fill="#4de1ff"/>
    <rect x="196" y="138" width="6" height="6" fill="#4de1ff"/>
    <rect x="200" y="152" width="6" height="6" fill="#ff4d6d"/>
    <rect x="190" y="160" width="6" height="6" fill="#4de1ff"/>
  </g>

  <!-- Tiny accent pixel on pad -->
  <rect x="86" y="196" width="5" height="5" fill="#4de1ff"/>
  <rect x="170" y="202" width="5" height="5" fill="#f5e6d3" opacity="0.7"/>

  <!-- Wordmark small bottom -->
  <text x="128" y="246" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="11" fill="#f5e6d3" letter-spacing="1">BONGO-CAT-TRAINER</text>
</svg>
