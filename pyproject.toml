[project]
name = "bongo-cat-trainer"
version = "2026.1.0"
description = "Bongo Cat Cheats & Trainers for PC — memory patching, auto tapper, aim assist, speed modifier, unlock all"
requires-python = ">=3.10"
authors = [{ name = "bongo-cat-trainer contributors" }]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=10.2.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.4.0"]
test = ["pytest>=8.0.0"]
dev = ["mypy>=1.8.0"]

[project.scripts]
bongo-cat-trainer = "bongo_cat_trainer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true